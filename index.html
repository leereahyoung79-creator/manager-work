<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff6fa8">
<title>매니저 업무 시스템</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="매니저업무">
<style>
:root{--pink:#ff6fa8;--purple:#a685fa;--lav:#c9a8ff;--peach:#ffb3c6;--ink:#5b3a5c;--sub:#9a7fa8;--line:#f3d6ea;--soft:#fff0f7;--warn:#ffe3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(150deg,#ffe6f2 0%,#f5e8ff 45%,#e5f1ff 100%);background-attachment:fixed;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);padding:30px 14px 44px}
.wrap{width:100%;max-width:560px;margin:0 auto}
.header{text-align:center;padding:6px 0 24px}
.deco{font-size:28px;margin-bottom:4px}
h1{font-size:24px;margin:0 0 7px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:13.5px;color:var(--sub);margin:0}
.menu{display:flex;flex-direction:column;gap:14px}
.card{display:flex;align-items:center;min-height:80px;width:100%;padding:16px 17px;border:1px solid var(--line);border-radius:18px;background:#fff;text-decoration:none;color:var(--ink);box-shadow:0 8px 22px rgba(199,120,180,.14);cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(166,133,250,.22)}
.icon{width:50px;height:50px;flex:0 0 50px;border-radius:15px;background:linear-gradient(135deg,var(--soft),#f3ecff);display:flex;align-items:center;justify-content:center;font-size:23px;margin-right:14px}
.icon.warn{background:linear-gradient(135deg,var(--warn),#fff0f7)}
.body{flex:1;min-width:0}
.title{font-size:16.5px;font-weight:800}
.desc{font-size:12.5px;color:var(--sub);margin-top:4px}
.arrow{font-size:25px;color:var(--lav)}
#vacationView{display:none}
#vacationFrame{width:100%;height:900px;border:0;border-radius:18px;background:#fff;box-shadow:0 8px 22px rgba(199,120,180,.14)}
#cardView{display:none}
#cardFrame{width:100%;height:820px;border:0;border-radius:18px;background:#fff;box-shadow:0 8px 22px rgba(199,120,180,.14)}
.back{display:block;width:100%;margin:10px 0 14px;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;font-size:14px}
.back:hover{border-color:var(--pink);color:var(--pink)}
.footer{text-align:center;font-size:11.5px;color:var(--sub);margin-top:24px}
.installBtn{display:none;width:100%;margin-top:16px;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:800;font-size:14.5px;font-family:inherit;letter-spacing:.2px;cursor:pointer;box-shadow:0 8px 18px rgba(166,133,250,.35)}
.installBtn:hover{transform:translateY(-1px)}
.installTip{display:none;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:12.5px;color:var(--ink);line-height:1.5;text-align:center}

@media (min-width:820px){
  body{padding:56px 24px}
  .wrap{max-width:680px}
  .deco{font-size:34px}
  h1{font-size:30px}
  .sub{font-size:15px}
  .header{padding-bottom:34px}
  .menu{gap:16px}
  .card{min-height:92px;padding:20px 22px;border-radius:22px}
  .icon{width:58px;height:58px;flex:0 0 58px;border-radius:17px;font-size:27px;margin-right:18px}
  .title{font-size:18.5px}
  .desc{font-size:13.5px}
  #vacationFrame{height:960px}
  #cardFrame{height:880px}
}
</style>
</head>

function decodeBase64Html(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function decodeVacationHtml() {
  return decodeBase64Html(vacationBase64);
}

function openVacation() {
  document.getElementById("home").style.display = "none";
  document.getElementById("vacationView").style.display = "block";
  const frame = document.getElementById("vacationFrame");
  if (!frame.srcdoc) frame.srcdoc = decodeVacationHtml();
  window.scrollTo(0, 0);
}

function closeVacation() {
  document.getElementById("vacationView").style.display = "none";
  document.getElementById("home").style.display = "block";
  window.scrollTo(0, 0);
}

function decodeCardHtml() {
  return decodeBase64Html(cardBase64);
}

function openCard() {
  document.getElementById("home").style.display = "none";
  document.getElementById("cardView").style.display = "block";
  const frame = document.getElementById("cardFrame");
  if (!frame.srcdoc) frame.srcdoc = decodeCardHtml();
  window.scrollTo(0, 0);
}

function closeCard() {
  document.getElementById("cardView").style.display = "none";
  document.getElementById("home").style.display = "block";
  window.scrollTo(0, 0);
}

// ---- 홈 화면에 앱으로 추가하기 (PWA 설치) ----
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

var deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredInstallPrompt = e;
  if (!isStandalone()) document.getElementById('installBtn').style.display = 'block';
});

function installApp() {
  if (!deferredInstallPrompt) return;
  var btn = document.getElementById('installBtn');
  btn.style.display = 'none';
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(function () { deferredInstallPrompt = null; });
}

window.addEventListener('appinstalled', function () {
  document.getElementById('installBtn').style.display = 'none';
});

(function () {
  if (isStandalone()) return; // 이미 앱으로 설치되어 실행 중이면 안내 숨김
  var ua = window.navigator.userAgent || '';
  var isIOS = /iphone|ipad|ipod/i.test(ua);
  if (isIOS) document.getElementById('iosTip').style.display = 'block';
})();
</script>
